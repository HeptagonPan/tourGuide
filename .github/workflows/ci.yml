name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 安装锁定依赖
        run: uv sync --locked --dev
      - name: 检查格式
        run: uv run ruff format --check .
      - name: 静态检查
        run: uv run ruff check .
      - name: 运行测试
        run: uv run pytest -q
      - name: 检查 Git 容量
        run: uv run python scripts/check_sizes.py --git-only
